name: Update configs & publish

on:
  workflow_dispatch:
  schedule:
    # Ежедневно, 06:40 UTC — гео-репозитории тегаются около 06:0x UTC.
    - cron: "40 6 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Refresh geo pins and rebuild deeplinks
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC

          GEOIP_REPO="hydraponique/roscomvpn-geoip"
          GEOSITE_REPO="hydraponique/roscomvpn-geosite"

          # Теги гео-репозиториев — строго YYYYMMDDhhmm. Всё остальное (test_*) отсекаем.
          latest_tag() {
            git ls-remote --tags "https://github.com/${1}.git" \
              | awk '{print $2}' \
              | sed -E 's@refs/tags/@@; s@\^\{\}@@' \
              | grep -E '^[0-9]{12}$' \
              | sort -r \
              | head -n 1
          }

          geoip_tag="$(latest_tag "$GEOIP_REPO")"
          geosite_tag="$(latest_tag "$GEOSITE_REPO")"
          [[ -n "$geoip_tag" && -n "$geosite_tag" ]]

          geoip_url="https://cdn.jsdelivr.net/gh/${GEOIP_REPO}@${geoip_tag}/release/geoip.dat"
          geosite_url="https://cdn.jsdelivr.net/gh/${GEOSITE_REPO}@${geosite_tag}/release/geosite.dat"

          # Пин, который стоит сейчас. Если не изменился — LastUpdated не трогаем:
          # Happ перекачивает базы только когда он вырос, дёргать клиентов зря не нужно.
          current_geoip="$(jq -r '.Geoipurl' HAPP/IN.JSON)"
          current_geosite="$(jq -r '.Geositeurl' HAPP/IN.JSON)"

          if [[ "$current_geoip" != "$geoip_url" || "$current_geosite" != "$geosite_url" ]]; then
            echo "geo pins changed -> geoip=$geoip_tag geosite=$geosite_tag"
            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geoip_url" >/dev/null
            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -I "$geosite_url" >/dev/null

            now_epoch="$(date -u +%s)"
            for f in HAPP/*.JSON INCY/*.JSON; do
              tmp="$(mktemp)"
              jq --arg ts "$now_epoch" --arg geoip "$geoip_url" --arg geosite "$geosite_url" \
                 '.LastUpdated = $ts | .Geoipurl = $geoip | .Geositeurl = $geosite' "$f" > "$tmp"
              mv "$tmp" "$f"
            done
          else
            echo "geo pins unchanged"
          fi

          # Правили JSON руками — ловим синтаксис до того, как он уедет в диплинк.
          for f in HAPP/*.JSON INCY/*.JSON; do
            jq -e 'has("Name") and has("GlobalProxy")' "$f" >/dev/null \
              || { echo "::error::$f — битый JSON или нет обязательных полей"; exit 1; }
          done

          for f in IN IN-GEOBLOCK OUT JSONSUB; do
            printf 'happ://routing/onadd/%s\n' "$(jq -c . "HAPP/$f.JSON" | base64 -w 0)" > "HAPP/$f.DEEPLINK"
            printf 'incy://routing/onadd/%s\n' "$(jq -c . "INCY/$f.JSON" | base64 -w 0)" > "INCY/$f.DEEPLINK"
          done

          # QR не собирается длиннее 2953 байт — ловим это здесь, а не глазами на сайте.
          for f in HAPP/*.DEEPLINK INCY/*.DEEPLINK; do
            len="$(tr -d '\n\r' < "$f" | wc -c)"
            if (( len > 2953 )); then
              echo "::error::$f = $len байт, QR не соберётся (лимит 2953). Сократи списки."
              exit 1
            fi
          done

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add HAPP INCY
          git diff --cached --quiet && exit 0
          git commit -m "$(date -u +%Y%m%d%H%M)"
          git push

      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq qrencode
          python3 site/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
