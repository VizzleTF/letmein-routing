# ============================================================
# LetMeIn — маршрутизация «снаружи в Россию» для Mihomo (Clash Meta)
# ============================================================
# ШАБЛОН ДЛЯ ПАНЕЛИ REMNAWAVE (тип MIHOMO). Для ручной вставки: default.yaml
#
# Задача обратная привычной: интернет не цензурируется, а вот российские
# сервисы режут зарубежные IP. Поэтому по умолчанию всё идёт НАПРЯМУЮ,
# а через туннель уходят только российские домены и адреса.
#
# Требуется российский выходной узел. Какие узлы считать российскими,
# группа 🇷🇺 РФ Авто решает по `filter:` — поправь его под свои имена узлов
# (по умолчанию ловит флаг 🇷🇺 в названии).
#
# Группы:
#   🇷🇺 РФ        — российский выход (основная группа)
#   🇷🇺 РФ Авто   — автовыбор среди российских узлов по задержке
#   🌍 Заграница  — зарубежный выход, если понадобится (по умолчанию DIRECT)
#   🔓 Без VPN    — принудительный DIRECT
#   ⛔ Блок       — REJECT
# ============================================================

mixed-port: 7890
mode: rule
log-level: warning
allow-lan: true
ipv6: false
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 15

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  cache-algorithm: arc
  # DoH-over-h3 = UDP/443; на части путей менее надёжен, чем h2.
  prefer-h3: false
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:private-domains
  # Локальный аплинк не цензурируется — резолвим им.
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  # Адреса узлов обязаны резолвиться БЕЗ прокси, иначе курица-яйцо на старте.
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - 1.1.1.1
  direct-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver-policy:
    # Реклама и телеметрия гасятся здесь, ДО всего остального: пустой успешный
    # ответ вместо адреса. Дешевле, чем RULE-SET: правило проверяется на каждом
    # коннекте, а тут домен просто не резолвится и соединение не открывается.
    # Идёт первым, иначе рекламные хосты в зоне .ru перехватит РФ-политика ниже.
    "rule-set:category-ads-all,category-ru-ads,microsoft-ads,ozon-ads,sber-ads,wildberries-ads,x5-ads,hagezi-spy-opporealme,hagezi-spy-winoffice,hagezi-spy-xiaomi":
      - rcode://success
    # Довесок: РФ-реклама и телеметрия устройств. Отдельным ключом, чтобы легко
    # выключалось, если что-то из этого окажется лишним.
    "rule-set:yandex-ads,vk-ads,avito-ads,samsung-ads,huawei-ads":
      - rcode://success
    # РФ-зоны резолвим российским DNS ЧЕРЕЗ российский узел. Иначе Яндекс/VK/CDN
    # отдадут европейские edge-адреса, а выходить мы будем с РФ-IP — рассинхрон
    # геолокации, на этом ломается часть сервисов.
    "rule-set:russia-outside,category-ru":
      - tls://77.88.8.8#🇷🇺 РФ
    "+.ru,+.рф,+.su":
      - tls://77.88.8.8#🇷🇺 РФ
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

sniffer:
  enable: true
  # false: с fake-ip перезапись назначения ломает выход на узлы (mihomo #2740).
  override-destination: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
  skip-dst-address:
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127

find-process-mode: "off"
profile:
  store-selected: true
  store-fake-ip: true

proxies: null
proxy-groups:
  - name: 🇷🇺 РФ
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - 🇷🇺 РФ Авто
    url: https://captive.apple.com/generate_204
    expected-status: 204
  - name: 🇷🇺 РФ Авто
    type: url-test
    lazy: true
    tolerance: 150
    # Apple captive portal, а не gstatic: Google из РФ душат, health-check
    # на gstatic даёт ложные «узел мёртв».
    url: https://captive.apple.com/generate_204
    expected-status: 204
    interval: 300
    # Правь под свои имена узлов: сюда должны попасть только российские выходы.
    filter: "🇷🇺"
    remnawave:
      include-proxies: false
    include-all: true
    hidden: true
  - name: 🌍 Заграница
    icon: https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hijacking.png
    type: select
    remnawave:
      include-proxies: false
    include-all: true
    proxies:
      - DIRECT
      - ⚡️ Авто
    url: https://captive.apple.com/generate_204
    expected-status: 204
  - name: ⚡️ Авто
    type: url-test
    lazy: true
    tolerance: 150
    url: https://captive.apple.com/generate_204
    expected-status: 204
    interval: 300
    exclude-filter: "🇷🇺"
    remnawave:
      include-proxies: false
    include-all: true
    hidden: true
  - name: 🔓 Без VPN
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - DIRECT
  - name: ⛔ Блок
    type: select
    hidden: true
    remnawave:
      include-proxies: false
    proxies:
      - REJECT

rule-providers:
  # Ядро кейса: домены, недоступные ИЗ-ЗА ГРАНИЦЫ. Обновляется ежедневно.
  russia-outside:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/itdoginfo/allow-domains/releases/latest/download/russia_outside_domain.mrs
    path: ./ruleset/russia-outside.mrs
    interval: 86400
  # Широкий список РФ-доменов — ловит то, чего нет в узком списке выше.
  category-ru:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/Davoyan/mihomo-rule-sets/main/rules/category-ru.mrs
    path: ./ruleset/category-ru.mrs
    interval: 86400
  ru-apps:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/legiz-ru/mihomo-rule-sets/main/other/ru-app-list.yaml
    path: ./ruleset/ru-apps.yaml
    interval: 86400
  private-domains:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/hydraponique/roscomvpn-geosite/release/mihomo/private.mrs
    path: ./ruleset/geosite-private.mrs
    interval: 2592000
  private-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/hydraponique/roscomvpn-geoip/release/mihomo/private.mrs
    path: ./ruleset/geoip-private.mrs
    interval: 2592000
  direct-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/hydraponique/roscomvpn-geoip/release/mihomo/direct.mrs
    path: ./ruleset/geoip-direct.mrs
    interval: 86400
  torrent-trackers:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/legiz-ru/mihomo-rule-sets/main/other/torrent-trackers.mrs
    path: ./ruleset/torrent-trackers.mrs
    interval: 86400
  torrent-clients:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/legiz-ru/mihomo-rule-sets/main/other/torrent-clients.yaml
    path: ./ruleset/torrent-clients.yaml
    interval: 86400
  win-spy:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/hydraponique/roscomvpn-geosite/release/mihomo/win-spy.mrs
    path: ./ruleset/win-spy.mrs
    interval: 86400

  # --- Реклама и телеметрия, гасятся на DNS (см. nameserver-policy) ---
  # Списки крошечные: все десять вместе ~66 КБ. mrs — сжатый trie, поэтому
  # category-ads-all весит 8 КБ, а adblock-списки «в лоб» — по 1.8 МБ.
  # В URL geosite-атрибут `@` кодируется как %40.
  category-ads-all:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/category-ads-all.mrs
    path: ./ruleset/category-ads-all.mrs
    interval: 86400
  category-ru-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/category-ru%40ads.mrs
    path: ./ruleset/category-ru-ads.mrs
    interval: 86400
  microsoft-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/microsoft%40ads.mrs
    path: ./ruleset/microsoft-ads.mrs
    interval: 86400
  ozon-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/ozon%40ads.mrs
    path: ./ruleset/ozon-ads.mrs
    interval: 86400
  sber-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/sber%40ads.mrs
    path: ./ruleset/sber-ads.mrs
    interval: 86400
  wildberries-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/wildberries%40ads.mrs
    path: ./ruleset/wildberries-ads.mrs
    interval: 86400
  x5-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/x5%40ads.mrs
    path: ./ruleset/x5-ads.mrs
    interval: 86400
  # Телеметрия производителей устройств — в общие ad-списки почти не попадает.
  # У hagezi это plain-text, по домену на строку, отсюда format: text.
  hagezi-spy-opporealme:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/native.oppo-realme.txt
    path: ./ruleset/hagezi-spy-opporealme.txt
    interval: 86400
  hagezi-spy-winoffice:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/native.winoffice.txt
    path: ./ruleset/hagezi-spy-winoffice.txt
    interval: 86400
  hagezi-spy-xiaomi:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/native.xiaomi.txt
    path: ./ruleset/hagezi-spy-xiaomi.txt
    interval: 86400
  # РФ-специфика, которой нет в category-ads-all (он про глобальные и китайские).
  # Атрибут @ads курируется так, чтобы резать рекламные поддомены, а не сервис.
  yandex-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/yandex%40ads.mrs
    path: ./ruleset/yandex-ads.mrs
    interval: 86400
  vk-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/vk%40ads.mrs
    path: ./ruleset/vk-ads.mrs
    interval: 86400
  avito-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/avito%40ads.mrs
    path: ./ruleset/avito-ads.mrs
    interval: 86400
  samsung-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/samsung%40ads.mrs
    path: ./ruleset/samsung-ads.mrs
    interval: 86400
  huawei-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/huawei%40ads.mrs
    path: ./ruleset/huawei-ads.mrs
    interval: 86400

rules:
  # --- Локальное: всегда напрямую ---
  # Явными IP-CIDR, а не только скачиваемым списком: если он не подтянулся,
  # обход локальной сети не должен исчезать.
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - RULE-SET,private-ips,DIRECT,no-resolve
  - RULE-SET,private-domains,DIRECT
  # --- Мусор ---
  - RULE-SET,win-spy,REJECT-DROP
  # Реклама/телеметрия. Основная линия — DNS (nameserver-policy, rcode://success):
  # домен не резолвится и соединение не открывается вовсе. Эти правила — подстраховка
  # для клиентов со своим DoH, которые ходят мимо нашего DNS.
  - RULE-SET,category-ads-all,REJECT-DROP
  - RULE-SET,category-ru-ads,REJECT-DROP
  - RULE-SET,microsoft-ads,REJECT-DROP
  - RULE-SET,ozon-ads,REJECT-DROP
  - RULE-SET,sber-ads,REJECT-DROP
  - RULE-SET,wildberries-ads,REJECT-DROP
  - RULE-SET,x5-ads,REJECT-DROP
  - RULE-SET,hagezi-spy-opporealme,REJECT-DROP
  - RULE-SET,hagezi-spy-winoffice,REJECT-DROP
  - RULE-SET,hagezi-spy-xiaomi,REJECT-DROP
  - RULE-SET,yandex-ads,REJECT-DROP
  - RULE-SET,vk-ads,REJECT-DROP
  - RULE-SET,avito-ads,REJECT-DROP
  - RULE-SET,samsung-ads,REJECT-DROP
  - RULE-SET,huawei-ads,REJECT-DROP
  # Торренты мимо туннеля: чужой датацентр под свой трафик подставлять не надо.
  - RULE-SET,torrent-trackers,DIRECT
  - RULE-SET,torrent-clients,DIRECT
  # --- Россия — через российский выход ---
  - RULE-SET,russia-outside,🇷🇺 РФ
  - RULE-SET,ru-apps,🇷🇺 РФ
  - RULE-SET,category-ru,🇷🇺 РФ
  - DOMAIN-SUFFIX,ru,🇷🇺 РФ
  - DOMAIN-SUFFIX,рф,🇷🇺 РФ
  - DOMAIN-SUFFIX,su,🇷🇺 РФ
  - DOMAIN-SUFFIX,vk.com,🇷🇺 РФ
  - DOMAIN-SUFFIX,userapi.com,🇷🇺 РФ
  - DOMAIN-SUFFIX,vk-cdn.net,🇷🇺 РФ
  - DOMAIN-SUFFIX,vkuser.net,🇷🇺 РФ
  - DOMAIN-SUFFIX,vkuservideo.net,🇷🇺 РФ
  - DOMAIN-SUFFIX,vkuserlive.net,🇷🇺 РФ
  - DOMAIN-SUFFIX,mycdn.me,🇷🇺 РФ
  - DOMAIN-SUFFIX,my.games,🇷🇺 РФ
  - DOMAIN-SUFFIX,yandex.net,🇷🇺 РФ
  - DOMAIN-SUFFIX,yandex.com,🇷🇺 РФ
  - DOMAIN-SUFFIX,okko.tv,🇷🇺 РФ
  - DOMAIN-SUFFIX,premier.one,🇷🇺 РФ
  - DOMAIN-SUFFIX,more.tv,🇷🇺 РФ
  - DOMAIN-SUFFIX,zvuk.com,🇷🇺 РФ
  - DOMAIN-SUFFIX,lenta.com,🇷🇺 РФ
  - DOMAIN-SUFFIX,sberbank.com,🇷🇺 РФ
  - DOMAIN-SUFFIX,emias.info,🇷🇺 РФ
  - DOMAIN-SUFFIX,pobeda.aero,🇷🇺 РФ
  - RULE-SET,direct-ips,🇷🇺 РФ,no-resolve
  # --- Остальное: интернет не цензурируется, идём напрямую ---
  - MATCH,DIRECT
